<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aanshi Agro Fresh - Freshness Delivered</title>

<style>
:root {
    --primary: #2e7d32;
    --accent: #ffa41c;
    --white: #ffffff;
    --bg: #f4f7f6;
}

body { font-family: 'Segoe UI'; margin: 0; background: var(--bg); }

/* Hero */
.hero {
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1350&q=80');
    height: 55vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    color:white;
}

/* Grid */
.container { padding: 20px; }
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.card {
    background:white;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
}

.card img { width:100%; height:140px; object-fit:cover; }

.price { margin:8px 0; }

/* Cart */
.floating-cart {
    position:fixed; bottom:20px; right:20px;
    background:green; color:white;
    width:60px; height:60px;
    display:flex; justify-content:center; align-items:center;
    border-radius:50%;
}

/* Modal */
.modal {
    display:none; position:fixed;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
}

.modal-content {
    background:white;
    width:90%; max-width:400px;
    margin:20% auto;
    padding:20px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>Aanshi Agro Fresh 🥬</h1>
</div>

<div class="container">
    <div class="grid" id="product-display"></div>
</div>

<div class="floating-cart" onclick="openModal()">🛒</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <input id="name" placeholder="Name"><br>
        <input id="phone" placeholder="Phone"><br>
        <textarea id="addr" placeholder="Address"></textarea><br>
        <button onclick="submitOrder()">Order</button>
    </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyXgigVxk3dWR0VtISvmPn45Meno71pKcNczHU_HqNl3q3AJE0lxlHb5zNxrD9JyLIgQg/exec";

let inventory = [];
let cart = {};

// Load Products
async function load() {
    let r = await fetch(API);
    inventory = await r.json();
    render();
}

function render() {
    let h = '';

    inventory.forEach(p => {
        h += `
        <div class="card">
            <img src="${p.img}">
            <h4>${p.name}</h4>

            <p class="price">
                <span style="text-decoration:line-through;color:#888;">
                    ₹${p.mrp}
                </span>
                <span style="color:green;font-weight:bold;">
                    ₹${p.price}
                </span>
                <br>
                <span style="color:red;">
                    Save ₹${p.mrp - p.price}
                </span> / ${p.unit}
            </p>

            <button onclick="addToCart(${p.id})">Add</button>
        </div>`;
    });

    document.getElementById('product-display').innerHTML = h;
}

// Add to cart
function addToCart(id) {
    if(!cart[id]) cart[id] = 0;
    cart[id]++;
}

// Open Modal
function openModal() {
    document.getElementById('modal').style.display = 'block';
}

// Submit Order (FIXED)
async function submitOrder() {

    const n = document.getElementById('name').value;
    const p = document.getElementById('phone').value;
    const a = document.getElementById('addr').value;

    if(!n || !p || !a) {
        alert("Fill all details!");
        return;
    }

    let totalVal = 0;

    const itemsArr = Object.entries(cart).map(([id, qty]) => {
        let item = inventory.find(x => x.id == id);
        let subtotal = item.price * qty;
        totalVal += subtotal;

        return `${item.name} - ${qty} ${item.unit} = ₹${subtotal}`;
    });

    const order = {
        name: n,
        phone: p,
        address: a,
        items: itemsArr.join("\n"),
        total: totalVal
    };

    await fetch(API, {
        method: 'POST',
        body: JSON.stringify(order)
    });

    alert("Order Placed Successfully!");

    cart = {};
    document.getElementById('modal').style.display = 'none';
}

load();
</script>

</body>
</html>
