<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanshi Agro Fresh</title>
    <style>
        :root { --primary: #2e7d32; --accent: #ffa41c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?w=1000'); background-size: cover; height: 35vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .nav-sticky { position: sticky; top: 0; background: var(--primary); padding: 12px; z-index: 1000; }
        .search-box { width: 90%; max-width: 500px; padding: 12px; border-radius: 25px; border: none; display: block; margin: auto; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; position: relative; padding-bottom: 10px; }
        .card img { width: 100%; height: 130px; object-fit: cover; }
        .discount-tag { position: absolute; top: 5px; left: 5px; background: #d32f2f; color: white; padding: 3px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .price-now { color: #b12704; font-weight: bold; font-size: 18px; }
        .price-was { text-decoration: line-through; color: #777; font-size: 13px; margin-left: 5px; }
        .qty-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px 0; }
        .qty-btn { background: #eee; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 18px; }
        .add-btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 5px; width: 90%; font-weight: bold; cursor: pointer; }
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1500; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .badge { position: absolute; top: 0; right: 0; background: red; color: white; border-radius: 50%; padding: 2px 7px; font-size: 12px; }
        .cart-panel { position: fixed; top: 0; right: -350px; width: 320px; height: 100%; background: white; z-index: 2000; transition: 0.3s; padding: 20px; box-shadow: -5px 0 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        .cart-panel.active { right: 0; }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div class="hero"><h1>Aanshi Agro Fresh 🥬</h1><p>তাজা সবজি সরাসরি আপনার ঘরে</p></div>
<div class="nav-sticky"><input type="text" class="search-box" id="search" placeholder="খুঁজুন..." onkeyup="search()"></div>
<div class="container"><div class="grid" id="display"></div></div>
<div class="floating-cart" onclick="toggleCart()">🛒<div class="badge" id="badge">0</div></div>

<div class="cart-panel" id="cartPanel">
    <h3>আপনার কার্ট 🛒</h3><hr>
    <div id="cart-content" style="height:65vh; overflow-y:auto;">ব্যাগ খালি।</div><hr>
    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size: 18px;"><span>মোট:</span><span id="total-val">₹0</span></div>
    <button class="add-btn" style="margin-top:20px;" onclick="openCheckout()">Order Now (COD)</button>
    <p onclick="toggleCart()" style="text-align:center; color:red; cursor:pointer;">বন্ধ করুন</p>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyXgigVxk3dWR0VtISvmPn45Meno71pKcNczHU_HqNl3q3AJE0lxlHb5zNxrD9JyLIgQg/exec";
    let inventory = [], cart = {};

    async function load() {
        const r = await fetch(API);
        const data = await r.json();
        inventory = data.map(p => ({
            ...p,
            price: Number(p.price),
            mrp: Number(p.mrp || p.price)
        }));
        render();
    }

    function render(list = inventory) {
        let h = '';
        list.forEach(p => {
            let q = cart[p.id] ? cart[p.id].qty : 0;
            let disc = Math.round(((p.mrp - p.price) / p.mrp) * 100);
            h += `<div class="card">
                ${disc > 0 ? `<div class="discount-tag">${disc}% ছাড়</div>` : ''}
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                <h4 style="margin:10px 0 5px;">${p.name}</h4>
                <div style="margin-bottom:10px;">
                    <span class="price-now">₹${p.price}</span>
                    ${p.mrp > p.price ? `<span class="price-was">₹${p.mrp}</span>` : ''}
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty('${p.id}', -1)">-</button>
                    <b style="font-size:18px;">${q}</b>
                    <button class="qty-btn" onclick="updateQty('${p.id}', 1)">+</button>
                </div>
                <button class="add-btn" onclick="updateQty('${p.id}', 1)">Add to Cart</button>
            </div>`;
        });
        document.getElementById('display').innerHTML = h;
    }

    function updateQty(id, change) {
        if (!cart[id]) {
            let p = inventory.find(x => x.id === id);
            cart[id] = { ...p, qty: 0 };
        }
        // গাণিতিক যোগ নিশ্চিত করতে Number() এবং Math.max ব্যবহার
        let current = Number(cart[id].qty);
        cart[id].qty = Math.max(0, current + Number(change));

        if (cart[id].qty <= 0) delete cart[id];
        updateUI();
        render();
    }

    function updateUI() {
        let h = '', total = 0, count = 0;
        Object.values(cart).forEach(i => {
            let sub = i.price * i.qty;
            total += sub;
            count += i.qty;
            h += `<div style="margin-bottom:10px;"><b>${i.name}</b><br>${i.qty} x ₹${i.price} = ₹${sub}</div><hr>`;
        });
        document.getElementById('cart-content').innerHTML = h || "ব্যাগ খালি।";
        document.getElementById('total-val').innerText = "₹" + total;
        document.getElementById('badge').innerText = count;
    }

    async function submitOrder() {
        // এই ফাংশনটি আগের মতোই থাকবে, শুধু ডাটা পাঠানোর সময় String conversion বন্ধ করে দেওয়া হয়েছে।
        // ... (আগের submitOrder কোড)
    }

    function toggleCart() { document.getElementById('cartPanel').classList.toggle('active'); }
    function search() { render(inventory.filter(p => p.name.toLowerCase().includes(document.getElementById('search').value.toLowerCase()))); }
    load();
</script>
</body>
</html>
