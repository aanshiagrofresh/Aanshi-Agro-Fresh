<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Smart Store</title>

<style>

body {
  font-family: Arial;
  margin: 0;
  background: #f3f3f3;
}

/* Header */
.header {
  background: #131921;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

/* Layout */
.container {
  display: flex;
  flex-wrap: wrap;
}

/* Products */
.products {
  width: 70%;
  padding: 20px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
  width: 200px;
  display: inline-block;
  vertical-align: top;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.price {
  color: #B12704;
  font-weight: bold;
}

/* Cart */
.cart {
  width: 30%;
  background: white;
  padding: 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

/* Buttons */
button {
  background: #ffd814;
  border: none;
  padding: 5px 10px;
  margin: 3px;
  cursor: pointer;
  border-radius: 5px;
}

.qty-btn {
  background: #ddd;
}

.checkout {
  width: 100%;
  padding: 10px;
  background: #ffa41c;
  font-weight: bold;
}

input {
  width: 95%;
  padding: 8px;
  margin: 5px 0;
}

</style>
</head>

<body>

<div class="header">🛒 My Smart Grocery Store</div>

<div class="container">

  <div class="products" id="products"></div>

  <div class="cart">
    <h2>Cart</h2>

    <input id="name" placeholder="Name">
    <input id="phone" placeholder="Phone">
    <input id="address" placeholder="Address">

    <div id="cartItems"></div>
    <h3 id="total"></h3>

    <button class="checkout" onclick="placeOrder()">Place Order (COD)</button>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwrb6iv5KgfMW4G6OKeGTc3sqCu8wMO50sk4uqop2JxnNJQLGFLPcif4r5d_c4aheT0/exec";

const products = [
  {id:1,name:"Potato", price:20, unit:"kg", img:"https://via.placeholder.com/150"},
  {id:2,name:"Onion", price:30, unit:"kg", img:"https://via.placeholder.com/150"},
  {id:3,name:"Banana", price:5, unit:"pc", img:"https://via.placeholder.com/150"}
];

let cart = [];

function showProducts(){
  let html = "";

  products.forEach(p=>{
    html += `
    <div class="card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p class="price">₹${p.price}/${p.unit}</p>
      <button onclick="add(${p.id})">Add to Cart</button>
    </div>`;
  });

  document.getElementById("products").innerHTML = html;
}

function add(id){
  let item = cart.find(p=>p.id===id);

  if(item){ item.qty++; }
  else{
    let p = products.find(p=>p.id===id);
    cart.push({...p, qty:1});
  }

  showCart();
}

function change(id,type){
  let item = cart.find(p=>p.id===id);

  if(type=="plus") item.qty++;
  if(type=="minus") item.qty--;

  if(item.qty<=0){
    cart = cart.filter(p=>p.id!==id);
  }

  showCart();
}

function showCart(){
  let html="";
  let total=0;

  cart.forEach(p=>{
    let sub = p.price*p.qty;
    total += sub;

    html += `
    <div>
      ${p.name}<br>
      ₹${p.price} x ${p.qty} = ₹${sub}<br>
      <button class="qty-btn" onclick="change(${p.id},'plus')">+</button>
      <button class="qty-btn" onclick="change(${p.id},'minus')">-</button>
      <hr>
    </div>`;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("total").innerText = "Total: ₹" + total;
}

function placeOrder(){

  if(cart.length==0){
    alert("Cart empty!");
    return;
  }

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let address = document.getElementById("address").value;

  let items="";
  let total=0;

  cart.forEach(p=>{
    items += `${p.name} ${p.qty}${p.unit} = ₹${p.price*p.qty}\n`;
    total += p.price*p.qty;
  });

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({name, phone, address, items, total})
  })
  .then(()=>{
    alert("Order Placed!");
    cart=[];
    showCart();
  });
}

showProducts();

</script>

</body>
</html>
