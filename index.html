<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Store</title>
</head>

<body>

<h2>🛒 My Store</h2>

<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="address" placeholder="Address"><br><br>

<button onclick="placeOrder()">Place Order</button>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwrb6iv5KgfMW4G6OKeGTc3sqCu8wMO50sk4uqop2JxnNJQLGFLPcif4r5d_c4aheT0/exec";

function placeOrder(){

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let address = document.getElementById("address").value;

  let data = {
    name: name,
    phone: phone,
    address: address,
    items: "Test Product 1kg",
    total: 100
  };

  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(res => {
    alert("Order Sent ✅");
    console.log(res);
  })
  .catch(err => {
    alert("Error ❌");
    console.log(err);
  });

}

</script>

</body>
</html>
