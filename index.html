<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanshi Agro Fresh</title>
    <style>
        :root { --primary: #2e7d32; --accent: #ffa41c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }
        
        /* Hero & Search */
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1350&q=80'); background-size: cover; height: 25vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .nav-sticky { position: sticky; top: 0; background: var(--primary); padding: 10px; z-index: 1000; }
        .search-box { width: 90%; max-width: 500px; padding: 10px 20px; border-radius: 25px; border: none; display: block; margin: auto; }

        /* Grid */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee; text-align: center; padding-bottom: 12px; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 130px; object-fit: cover; }
        
        /* Price Styles */
        .price-container { margin: 10px 0; min-height: 45px; }
        .mrp { color: #999; text-decoration: line-through; font-size: 13px; margin-right: 5px; }
        .sale-price { color: var(--primary); font-weight: bold; font-size: 18px; }
        .discount { background: #ffeb3b; color: #000; font-size: 11px; padding: 2px 5px; border-radius: 4px; font-weight: bold; display: block; width: fit-content; margin: 5px auto; }

        /* Buttons */
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .qty-btn { background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 8px; width: 90%; border-radius: 20px; font-weight: bold; cursor: pointer; margin: auto; }

        /* Cart Panel */
        .cart-panel { position: fixed; top: 0; right: -400px; width: 350px; height: 100%; background: white; z-index: 2000; transition: 0.4s; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        .cart-panel.active { right: 0; }
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1500; }
        .cart-badge { position: absolute; top: 0; right: 0; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; }

        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } .cart-panel { width: 100%; right: -100%; } }
    </style>
</head>
<body>

<div class="hero">
    <h1>Aanshi Agro Fresh 🥬</h1>
    <p>সতেজ সবজি ও ফল আপনার দরজায়</p>
</div>

<div class="nav-sticky">
    <input type="text" class="search-box" id="search" placeholder="খুঁজুন..." onkeyup="search()">
</div>

<div class="container">
    <div id="loader" style="text-align:center;">লোড হচ্ছে...</div>
    <div class="grid" id="product-display"></div>
</div>

<div class="floating-cart" onclick="toggleCart()">
    <span>🛒</span>
    <div class="cart-badge" id="badge">0</div>
</div>

<div class="cart-panel" id="cartPanel">
    <span onclick="toggleCart()" style="cursor:pointer; font-size: 24px;">×</span>
    <h2 style="text-align: center;">আপনার ব্যাগ 🛒</h2>
    <hr>
    <div id="cart-content" style="max-height: 70vh; overflow-y: auto;">ব্যাগ খালি।</div>
    <hr>
    <div style="display:flex; justify-content:space-between; font-weight:bold;">
        <span>মোট:</span>
        <span id="total-val">₹0</span>
    </div>
    <button id="checkout-btn" style="display:none; width:100%; background:var(--primary); color:white; border:none; padding:15px; margin-top:10px; border-radius:10px; cursor:pointer;" onclick="alert('অর্ডার ফিচারে কাজ চলছে!')">Check Out (COD)</button>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyXgigVxk3dWR0VtISvmPn45Meno71pKcNczHU_HqNl3q3AJE0lxlHb5zNxrD9JyLIgQg/exec";
    let inventory = [];
    let cart = {};

    async function load() {
        try {
            const r = await fetch(API);
            const rawData = await r.json();
            // এখানে ID নিশ্চিত করা হচ্ছে, যদি শিটে না থাকে তবে সিরিয়াল নম্বরকে ID বানানো হচ্ছে
            inventory = rawData.map((item, index) => ({
                ...item,
                id: item.id || `prod_${index}` 
            }));
            document.getElementById('loader').style.display = 'none';
            render();
        } catch(e) { document.getElementById('loader').innerText = "ডাটা লোড হয়নি।"; }
    }

    function render(data = inventory) {
        let h = '';
        data.forEach(p => {
            const q = cart[p.id]?.qty || 0; // শুধুমাত্র এই প্রোডাক্টের কোয়ান্টিটি
            
            let mrpText = "";
            let discText = "";
            if (p.mrp && Number(p.mrp) > Number(p.price)) {
                mrpText = `<span class="mrp">₹${p.mrp}</span>`;
                let d = Math.round(((p.mrp - p.price) / p.mrp) * 100);
                discText = `<span class="discount">${d}% ছাড়</span>`;
            }

            h += `
                <div class="card">
                    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                    <h4>${p.name}</h4>
                    <div class="price-container">
                        ${mrpText} <span class="sale-price">₹${p.price}</span>
                        ${discText}
                        <div style="font-size: 11px; color: #777;">প্রতি ${p.unit}</div>
                    </div>
                    <div class="qty-box">
                        <button class="qty-btn" onclick="updateQty('${p.id}', -1)">-</button>
                        <span style="font-weight:bold; min-width:20px;">${q}</span>
                        <button class="qty-btn" onclick="updateQty('${p.id}', 1)">+</button>
                    </div>
                    <button class="btn-add" onclick="updateQty('${p.id}', 1)">
                        ${q > 0 ? 'আরো যোগ করুন' : 'কার্টে যোগ করুন'}
                    </button>
                </div>`;
        });
        document.getElementById('product-display').innerHTML = h;
    }

    function updateQty(pid, change) {
        if (!cart[pid]) {
            const product = inventory.find(x => x.id === pid);
            if(!product) return;
            cart[pid] = { ...product, qty: 0 };
        }
        
        cart[pid].qty += change;
        if (cart[pid].qty <= 0) delete cart[pid];
        
        updateCartDisplay();
        render(); // এটিই মেইন, যা শুধু নির্দিষ্ট কার্ডকে আপডেট করবে
    }

    function updateCartDisplay() {
        let h = ''; let total = 0; let count = 0;
        Object.values(cart).forEach(item => {
            let sub = item.price * item.qty;
            total += sub;
            count += item.qty;
            h += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                    <div><b>${item.name}</b><br><small>${item.qty} x ₹${item.price}</small></div>
                    <b>₹${sub}</b>
                  </div>`;
        });
        document.getElementById('cart-content').innerHTML = h || "ব্যাগ খালি।";
        document.getElementById('total-val').innerText = "₹" + total;
        document.getElementById('badge').innerText = count;
        document.getElementById('checkout-btn').style.display = total > 0 ? 'block' : 'none';
    }

    function toggleCart() { document.getElementById('cartPanel').classList.toggle('active'); }
    function search() {
        let q = document.getElementById('search').value.toLowerCase();
        render(inventory.filter(p => p.name.toLowerCase().includes(q)));
    }

    load();
</script>
</body>
</html>
