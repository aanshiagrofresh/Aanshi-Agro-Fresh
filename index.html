<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanshi Agro Fresh - Freshness Delivered</title>
    <style>
        :root { --primary: #2e7d32; --accent: #ffa41c; --white: #ffffff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: #333; }
        .lang-switch { position: absolute; top: 20px; right: 20px; z-index: 2000; }
        .lang-btn { background: var(--white); border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1350&q=80'); background-size: cover; background-position: center; height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .brand-logo { width: 120px; height: 120px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border: 4px solid var(--accent); overflow: hidden; }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .nav-sticky { position: sticky; top: 0; background: var(--primary); padding: 12px; z-index: 1000; }
        .search-box { width: 90%; max-width: 500px; padding: 12px; border-radius: 30px; border: none; display: block; margin: auto; outline: none; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border: 1px solid #eee; position: relative; }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        
        /* ডিসকাউন্ট এবং কাটা রেট স্টাইল */
        .discount-tag { position: absolute; top: 8px; left: 8px; background: #d32f2f; color: white; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .price-now { color: var(--primary); font-weight: bold; font-size: 18px; display: block; }
        .price-was { text-decoration: line-through; color: #999; font-size: 13px; margin-top: 2px; display: block; }

        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
        .qty-btn { background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 10px; width: 90%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .floating-cart { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1500; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 3px 8px; font-size: 11px; }
        .cart-panel { position: fixed; top: 0; right: -350px; width: 320px; height: 100%; background: white; z-index: 2000; transition: 0.4s; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .cart-panel.active { right: 0; }
        #cart-content { flex: 1; overflow-y: auto; margin-top: 30px; }
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; width: 90%; max-width: 400px; margin: 15% auto; padding: 20px; border-radius: 15px; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div class="lang-switch"><button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button></div>
<div class="hero">
    <div class="brand-logo"><img src="logo.jpg.jpge" alt="Logo"></div>
    <h1 id="heroTitle">Aanshi Agro Fresh 🥬</h1>
    <p id="heroSubtitle">চাষির মাঠের সতেজতা, আপনার ঘরের দরজায়</p>
</div>
<div class="nav-sticky"><input type="text" class="search-box" id="search" placeholder="খুঁজুন..." onkeyup="search()"></div>

<div class="container">
    <div id="loader" style="text-align:center;">প্রোডাক্ট লোড হচ্ছে...</div>
    <div class="grid" id="product-display"></div>
</div>

<div class="floating-cart" onclick="toggleCart()">🛒<div class="cart-badge" id="badge">0</div></div>

<div class="cart-panel" id="cartPanel">
    <span onclick="toggleCart()" style="cursor:pointer; font-size:25px;">×</span>
    <h2 id="cartTitle">আপনার ব্যাগ 🛒</h2><hr>
    <div id="cart-content">ব্যাগ খালি।</div><hr>
    <div style="display:flex; justify-content:space-between; font-weight:bold;">
        <span id="totalText">মোট:</span><span id="total-val">₹0</span>
    </div>
    <button class="btn-add" style="background:var(--primary); margin-top:10px; width:100%;" onclick="openModal()">Check Out</button>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3>অর্ডার তথ্য</h3>
        <input type="text" id="name" placeholder="নাম">
        <input type="tel" id="phone" placeholder="মোবাইল">
        <textarea id="addr" placeholder="ঠিকানা" rows="3"></textarea>
        <button class="btn-add" onclick="submitOrder()">Confirm</button>
        <p onclick="closeModal()" style="color:red; cursor:pointer;">বন্ধ করুন</p>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyXgigVxk3dWR0VtISvmPn45Meno71pKcNczHU_HqNl3q3AJE0lxlHb5zNxrD9JyLIgQg/exec";
    let inventory = [], cart = {}, lang = 'bn';

    async function load() {
        try {
            const r = await fetch(API);
            const data = await r.json();
            // ডাটা ম্যাপ করার সময় নিশ্চিত করছি যে MRP এবং Price সংখ্যা হিসেবে আসছে
            inventory = data.map(p => ({
                ...p,
                price: Number(p.price) || 0,
                mrp: Number(p.mrp) || Number(p.price)
            }));
            document.getElementById('loader').style.display = 'none';
            render();
        } catch(e) { console.error(e); }
    }

    function render(data = inventory) {
        let h = '';
        data.forEach(p => {
            let discount = Math.round(((p.mrp - p.price) / p.mrp) * 100);
            let q = cart[p.id] ? cart[p.id].qty : 0;
            h += `<div class="card">
                ${discount > 0 ? `<div class="discount-tag">${discount}% OFF</div>` : ''}
                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150'">
                <h4>${p.name}</h4>
                <span class="price-now">₹${p.price} / ${p.unit}</span>
                ${p.mrp > p.price ? `<span class="price-was">₹${p.mrp}</span>` : '<span style="height:15px; display:block;"></span>'}
                <div class="qty-box">
                    <button class="qty-btn" onclick="updateQty('${p.id}', -1)">-</button>
                    <span id="q-${p.id}" style="font-weight:bold;">${q}</span>
                    <button class="qty-btn" onclick="updateQty('${p.id}', 1)">+</button>
                </div>
                <button class="btn-add" onclick="updateQty('${p.id}', 1)">Add</button>
            </div>`;
        });
        document.getElementById('product-display').innerHTML = h;
    }

    function updateQty(id, change) {
        if (!cart[id]) {
            const p = inventory.find(x => x.id == id);
            cart[id] = { ...p, qty: 0 };
        }
        
        // ১১/২১ সমস্যা সমাধানের আসল জায়গা: parseInt ব্যবহার করে সংখ্যা নিশ্চিত করা
        let current = parseInt(cart[id].qty);
        let added = parseInt(change);
        cart[id].qty = current + added;

        if (cart[id].qty <= 0) delete cart[id];
        
        updateCartDisplay();
        // কার্ডের ভেতরের সংখ্যা আপডেট
        const qSpan = document.getElementById(`q-${id}`);
        if(qSpan) qSpan.innerText = cart[id] ? cart[id].qty : 0;
    }

    function updateCartDisplay() {
        let h = '', total = 0, count = 0;
        Object.values(cart).forEach(i => {
            let sub = i.price * i.qty;
            total += sub;
            count += i.qty;
            h += `<div style="padding:10px; border-bottom:1px solid #eee;">
                <b>${i.name}</b><br>${i.qty} x ₹${i.price} = ₹${sub}
            </div>`;
        });
        document.getElementById('cart-content').innerHTML = h || "ব্যাগ খালি।";
        document.getElementById('total-val').innerText = "₹" + total;
        document.getElementById('badge').innerText = count;
    }

    // ল্যাঙ্গুয়েজ এবং অন্যান্য ফাংশন
    function toggleLang() { /* আগের মতোই */ lang = lang === 'bn' ? 'en' : 'bn'; render(); }
    function toggleCart() { document.getElementById('cartPanel').classList.toggle('active'); }
    function search() { let q = document.getElementById('search').value.toLowerCase(); render(inventory.filter(p => p.name.toLowerCase().includes(q))); }
    function openModal() { document.getElementById('modal').style.display = 'block'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    async function submitOrder() {
        // সাবমিট করার সময়ও কার্ট ক্লিয়ার হয়ে যাবে
        const n = document.getElementById('name').value, ph = document.getElementById('phone').value, ad = document.getElementById('addr').value;
        if(!n || !ph || !ad) return alert("তথ্য দিন!");
        const order = { name: n, phone: ph, address: ad, items: Object.values(cart).map(i => `${i.name} (${i.qty}${i.unit})`).join(", "), total: document.getElementById('total-val').innerText };
        await fetch(API, { method: 'POST', body: JSON.stringify(order) });
        alert("অর্ডার সফল!"); cart = {}; updateCartDisplay(); closeModal(); render();
    }
    load();
</script>
</body>
</html>
