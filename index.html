<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aanshi Agro Fresh - Freshness Delivered</title>

<style>
:root {
    --primary: #2e7d32;
    --accent: #ffa41c;
    --white: #ffffff;
    --bg: #f4f7f6;
}

body { font-family: 'Segoe UI'; margin: 0; background: var(--bg); }

/* Hero */
.hero {
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1350&q=80');
    height: 55vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    color:white;
}

/* Grid */
.container { padding: 20px; }
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.card {
    background:white;
    border-radius:10px;
    overflow:hidden;
    text-align:center;
}

.card img { width:100%; height:140px; object-fit:cover; }

.price { margin:8px 0; }

/* Cart */
.floating-cart {
    position:fixed; bottom:20px; right:20px;
    background:green; color:white;
    width:60px; height:60px;
    display:flex; justify-content:center; align-items:center;
    border-radius:50%;
}

/* Modal */
.modal {
    display:none; position:fixed;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
}

.modal-content {
    background:white;
    width:90%; max-width:400px;
    margin:20% auto;
    padding:20px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>Aanshi Agro Fresh 🥬</h1>
</div>

<div class="container">
    <div class="grid" id="product-display"></div>
</div>

<div class="floating-cart" onclick="openModal()">🛒</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <input id="name" placeholder="Name"><br>
        <input id="phone" placeholder="Phone"><br>
        <textarea id="addr" placeholder="Address"></textarea><br>
        <button onclick="submitOrder()">Order</button>
    </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyXgigVxk3dWR0VtISvmPn45Meno71pKcNczHU_HqNl3q3AJE0lxlHb5zNxrD9JyLIgQg/exec";

let inventory = [];
let cart = {};
let lang = 'bn';

// LOAD
async function load() {
    try {
        const r = await fetch(API);
        inventory = await r.json();
        document.getElementById('loader').style.display = 'none';
        render();
    } catch(e) {
        document.getElementById('loader').innerText = "Error Loading Products";
    }
}

// RENDER (✅ FIXED DISCOUNT SAFE)
function render(data = inventory) {
    let h = '';
    data.forEach(p => {

        h += `
        <div class="card">
            <img src="${p.img}" onerror="this.src='https://via.placeholder.com/150?text=Agro+Fresh'">
            <h4>${p.name}</h4>

            <p class="price">
                ${p.mrp ? `<span style="text-decoration:line-through;color:#888;font-size:14px;">₹${p.mrp}</span>` : ""}
                <span style="color: var(--primary); font-weight:bold;">₹${p.price}</span>
                ${p.mrp ? `<br><span style="color:red;font-size:13px;">Save ₹${p.mrp - p.price}</span>` : ""}
                / ${p.unit}
            </p>

            <div class="qty-box">
                <button class="qty-btn" onclick="updateQty(${p.id}, -1)">-</button>
                <span id="q-${p.id}">${cart[p.id]?.qty || 0}</span>
                <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
            </div>

            <button class="btn-add" onclick="updateQty(${p.id}, 1)">
                Add to Cart
            </button>
        </div>`;
    });

    document.getElementById('product-display').innerHTML = h;
}

// QTY
function updateQty(id, change) {
    if (!cart[id]) {
        const p = inventory.find(x => x.id == id);
        cart[id] = { ...p, qty: 0 };
    }

    cart[id].qty += change;

    if (cart[id].qty <= 0) delete cart[id];

    if(document.getElementById(`q-${id}`))
        document.getElementById(`q-${id}`).innerText = cart[id]?.qty || 0;

    updateCart();
}

// CART
function updateCart() {
    let h = '';
    let totalVal = 0;
    let count = 0;

    Object.values(cart).forEach(i => {
        let s = i.price * i.qty;
        totalVal += s;
        count += i.qty;

        h += `<div style="margin-bottom:15px;">
                <b>${i.name}</b><br>
                ${i.qty} x ₹${i.price} = ₹${s}
              </div>`;
    });

    document.getElementById('cart-content').innerHTML = h || "Cart empty";
    document.getElementById('total-val').innerText = "₹" + totalVal;
    document.getElementById('badge').innerText = count;
    document.getElementById('checkout-btn').style.display = totalVal > 0 ? 'block' : 'none';
}

// MODAL
function openModal() {
    document.getElementById('modal').style.display = 'block';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

// ✅ FINAL ORDER FIX (NO 11/21 BUG)
async function submitOrder() {

    const n = document.getElementById('name').value;
    const p = document.getElementById('phone').value;
    const a = document.getElementById('addr').value;

    if(!n || !p || !a) return alert("Fill all details!");

    let totalVal = 0;

    const itemsArr = Object.values(cart).map(i => {
        let subtotal = i.price * i.qty;
        totalVal += subtotal;

        return `${i.name} (${i.qty} ${i.unit}) = ₹${subtotal}`;
    });

    const order = {
        name: n,
        phone: p,
        address: a,
        items: itemsArr.join(", "),
        total: totalVal
    };

    await fetch(API, {
        method: 'POST',
        body: JSON.stringify(order)
    });

    alert("Order Placed Successfully!");

    cart = {};
    updateCart();
    closeModal();
    render();
}

load();
</script>

</body>
</html>
